# Keep the app fully offline except for the hackathon API (no Streamlit telemetry)
[browser]
gatherUsageStats = false

# Light "card" palette; app.py adds the layout CSS on top. Font falls back to sans-serif offline.
[theme]
base = "light"
primaryColor = "#111827"
backgroundColor = "#EEF2F7"
secondaryBackgroundColor = "#F4F6FB"
textColor = "#0F172A"
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap, sans-serif"
